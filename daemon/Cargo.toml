[package]
name = "vertebr-daemon"
version = "1.0.0"
edition = "2021"
authors = ["Houssam"]
description = "Vertebr System Daemon - Modular settings backend for Pop!_OS"
license = "MIT"

[[bin]]
name = "vertebr-daemon"
path = "src/main.rs"

[dependencies]
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
tokio       = { version = "1", features = ["full"] }
libloading  = "0.8"
toml        = "0.8"
libc        = "0.2"
