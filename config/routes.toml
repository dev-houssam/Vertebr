handler    = "system_info_fn"
permission = "user"

[[route]]
path       = "system:timezone"
module     = "libsystem_module.so"
handler    = "system_timezone_info"
permission = "user"

[[route]]
path       = "system:timezones"
module     = "libsystem_module.so"
handler    = "system_timezones_list"
permission = "user"

[[route]]
path       = "system:user"
module     = "libsystem_module.so"
handler    = "system_current_user"
permission = "user"

[[route]]
path       = "system:set_hostname"
module     = "libsystem_module.so"
handler    = "system_set_hostname_fn"
permission = "sudo"

[[route]]
path       = "system:set_timezone"
module     = "libsystem_module.so"
handler    = "system_set_timezone_fn"
permission = "sudo"

[[route]]
path       = "system:set_ntp"
module     = "libsystem_module.so"
handler    = "system_set_ntp_fn"
permission = "sudo"

[[route]]
path       = "system:set_locale"
module     = "libsystem_module.so"
