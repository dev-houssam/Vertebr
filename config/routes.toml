[[route]]
path       = "caps:list"
module     = "libcaps_module.so"
handler    = "list_capabilities"
permission = "user"

[[route]]
path       = "caps:get"
module     = "libcaps_module.so"
handler    = "get_binary_caps_fn"
permission = "user"

[[route]]
path          = "caps:grant"
module        = "libcaps_module.so"
handler       = "grant_capability"
permission    = "caps"
required_caps = ["CAP_SYS_ADMIN", "CAP_SETFCAP"]

[[route]]
path          = "caps:revoke"
module        = "libcaps_module.so"
handler       = "revoke_capability"
permission    = "caps"
required_caps = ["CAP_SYS_ADMIN", "CAP_SETFCAP"]
