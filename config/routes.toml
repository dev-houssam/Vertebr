# ============================================================
# VERTEBR — routes.toml
# Configuration centrale des routes
# Auteur : Houssam | Licence : MIT
#
# Format :
#   [[route]]
#   path       = "module:action"    # Identifiant unique
#   module     = "module_name.so"   # Fichier dans /usr/lib/vertebr/modules/
#   handler    = "function_name"    # Fonction C exportée par le module
#   permission = "user|sudo|caps"   # Niveau de permission
#   required_caps = [...]           # Uniquement pour permission = "caps"
# ============================================================

# ── Wi-Fi ───────────────────────────────────────────────────

[[route]]
path       = "wifi:list"
module     = "libwifi_module.so"
handler    = "list_networks"
permission = "user"

[[route]]
path       = "wifi:status"
module     = "libwifi_module.so"
handler    = "wifi_status"
permission = "user"

[[route]]
path       = "wifi:connect"
module     = "libwifi_module.so"
handler    = "connect_network"
permission = "user"

[[route]]
path       = "wifi:disconnect"
module     = "libwifi_module.so"
handler    = "disconnect_wifi"
permission = "user"

[[route]]
path       = "wifi:enabled"
module     = "libwifi_module.so"
handler    = "set_wifi_enabled"
permission = "user"

[[route]]
path       = "wifi:airplane"
module     = "libwifi_module.so"
handler    = "airplane_mode"
permission = "user"

[[route]]
path       = "wifi:forget"
module     = "libwifi_module.so"
handler    = "forget_network"
permission = "user"

